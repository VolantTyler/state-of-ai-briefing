# Refresh the briefing data. The job commits public/data through the GitHub
# contents API. Vercel production deploys those commits. See docs/refresh.md.
#
# Cron is UTC and does not follow US daylight time.
# The minute is 17 and 23 so these miss the top of the hour, when GitHub
# delays or drops scheduled runs under load.
#   17 8 * * *  daily panels except valuations.
#               08:17 UTC = 4:17 AM EDT / 3:17 AM EST.
#   23 10 * * 0 valuations only, early Sunday Eastern.
#               10:23 UTC = 6:23 AM EDT / 5:23 AM EST.
# src/refresh-policy.js compares github.event.schedule to those strings.

name: Refresh briefing data

on:
  schedule:
    - cron: "17 8 * * *"
    - cron: "23 10 * * 0"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Panel ids. Commas or spaces. Case does not matter. Blank = daily set (no valuations)."
        required: false
        default: ""
        type: string

# A second run waits. It does not cancel the first, and it does not overlap.
concurrency:
  group: state-of-ai-refresh
  cancel-in-progress: false

# Checkout only. Writes use a GitHub App installation token scoped to this
# repository, or GH_CONTENTS_TOKEN when that token was not minted. The
# built-in GITHUB_TOKEN is not used for those commits. The script reads
# GITHUB_TOKEN. Each contents PUT sets the repo-owner author. See
# docs/refresh.md.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Note GitHub App secret presence
        id: app-secrets
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GH_APP_ID:-}" ] && [ -n "${GH_APP_PRIVATE_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "GitHub App secrets are set. Minting an installation token."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "GitHub App secrets are missing."
          fi
      - name: Mint GitHub App installation token
        id: app-token
        if: steps.app-secrets.outputs.present == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
      - name: Select contents token
        id: contents-auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.GH_CONTENTS_TOKEN }}
          APP_SECRETS_PRESENT: ${{ steps.app-secrets.outputs.present }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            echo "Contents token path: GitHub App installation token."
            echo "source=app" >> "$GITHUB_OUTPUT"
          elif [ -n "${PAT:-}" ]; then
            if [ "${APP_SECRETS_PRESENT:-}" = "true" ]; then
              echo "Contents token path: GH_CONTENTS_TOKEN fallback. Installation token minting failed."
            else
              echo "Contents token path: GH_CONTENTS_TOKEN fallback. GitHub App secrets are missing."
            fi
            echo "source=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No contents token. Set GH_APP_ID and GH_APP_PRIVATE_KEY, or GH_CONTENTS_TOKEN."
            exit 1
          fi
      - name: Refresh
        run: node scripts/refresh.js
        env:
          REFRESH_EVENT: ${{ github.event_name }}
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
          REFRESH_JOBS: ${{ github.event.inputs.jobs }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ case(steps.contents-auth.outputs.source == 'app', steps.app-token.outputs.token, secrets.GH_CONTENTS_TOKEN) }}
          GITHUB_COMMIT_NAME: Tyler Stahl
          GITHUB_COMMIT_EMAIL: tylerstahl@gmail.com
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GROK_BOT_WEBHOOK_URL: ${{ secrets.GROK_BOT_WEBHOOK_URL }}
          GROK_BOT_WEBHOOK_KEY: ${{ secrets.GROK_BOT_WEBHOOK_KEY }}
          REFRESH_MAX_USD: ${{ vars.REFRESH_MAX_USD }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_MODEL_VALUATIONS: ${{ vars.ANTHROPIC_MODEL_VALUATIONS }}
          ANTHROPIC_MODEL_MODELS: ${{ vars.ANTHROPIC_MODEL_MODELS }}
          ANTHROPIC_MODEL_USERS: ${{ vars.ANTHROPIC_MODEL_USERS }}
          ANTHROPIC_MODEL_SHARE: ${{ vars.ANTHROPIC_MODEL_SHARE }}
          ANTHROPIC_MODEL_CAPITAL: ${{ vars.ANTHROPIC_MODEL_CAPITAL }}
          ANTHROPIC_MODEL_ENERGY: ${{ vars.ANTHROPIC_MODEL_ENERGY }}
          REFRESH_MAX_DURATION_MS: ${{ vars.REFRESH_MAX_DURATION_MS }}
          REFRESH_TAIL_RESERVE_MS: ${{ vars.REFRESH_TAIL_RESERVE_MS }}
          REFRESH_CALL_TIMEOUT_MS: ${{ vars.REFRESH_CALL_TIMEOUT_MS }}
          REFRESH_VALUATIONS_CALL_TIMEOUT_MS: ${{ vars.REFRESH_VALUATIONS_CALL_TIMEOUT_MS }}
          REFRESH_VALUATIONS_MIN_START_MS: ${{ vars.REFRESH_VALUATIONS_MIN_START_MS }}
