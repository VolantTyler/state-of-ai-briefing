# Weekly check of the credentials that commit public/data.
# The refresh mints a GitHub App installation token and falls back to
# GH_CONTENTS_TOKEN. Installation tokens last about an hour, so this job
# checks that the app can still mint and read contents. The PAT expiry
# check stays while that fallback is what refresh would use.
# See docs/refresh.md.
#
# Cron is UTC and does not follow US daylight time.
# The minute is 41 so this misses :00 and :30, when GitHub delays or drops
# scheduled runs under load.
#   41 12 * * 1  Monday morning Eastern.
#               12:41 UTC = 8:41 AM EDT / 7:41 AM EST.

name: Check contents credentials

on:
  schedule:
    - cron: "41 12 * * 1"
  workflow_dispatch:

# No checkout. The app token is minted from the private key. The PAT check
# uses GH_CONTENTS_TOKEN. The built-in GITHUB_TOKEN is not used.
permissions: {}

jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Note which credentials are set
        id: creds
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_CONTENTS_TOKEN: ${{ secrets.GH_CONTENTS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GH_APP_ID:-}" ] && [ -n "${GH_APP_PRIVATE_KEY:-}" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "GitHub App secrets are set."
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "GitHub App secrets are missing."
          fi
          if [ -n "${GH_CONTENTS_TOKEN:-}" ]; then
            echo "pat=true" >> "$GITHUB_OUTPUT"
            echo "GH_CONTENTS_TOKEN is set."
          else
            echo "pat=false" >> "$GITHUB_OUTPUT"
            echo "GH_CONTENTS_TOKEN is not set."
          fi
      - name: Require a contents credential
        if: success() && steps.creds.outputs.app != 'true' && steps.creds.outputs.pat != 'true'
        run: |
          set -euo pipefail
          echo "::error::No contents credential. Set GH_APP_ID and GH_APP_PRIVATE_KEY, or GH_CONTENTS_TOKEN."
          exit 1
      - name: Mint GitHub App installation token
        id: app-token
        if: success() && steps.creds.outputs.app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
      - name: Verify the installation token can read contents
        id: verify-contents
        if: success() && steps.creds.outputs.app == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::error::The installation token was empty after minting."
            exit 1
          fi
          headers=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$headers" "$body"' EXIT
          # -sS keeps the progress meter off and still prints curl errors.
          # Verbose curl and command tracing print the Authorization header. Do not enable either.
          # Do not follow redirects. The token stays on api.github.com.
          if ! status=$(curl -sS --max-time 30 \
            -D "$headers" \
            -o "$body" \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -- "https://api.github.com/repos/${REPO}/contents/public/data/values.json?ref=main"); then
            echo "::error::The contents request failed before a status code was returned."
            exit 1
          fi
          case "$status" in
            2[0-9][0-9])
              echo "Installation token can read repository contents."
              ;;
            *)
              echo "::error::Installation token contents read returned HTTP ${status}."
              exit 1
              ;;
          esac
      - name: Check GH_CONTENTS_TOKEN expiry
        if: ${{ !cancelled() && steps.creds.outputs.pat == 'true' }}
        env:
          # Fail when the token expires sooner than this many days.
          EXPIRY_MIN_DAYS: "14"
          APP_READY: ${{ steps.app-token.outcome == 'success' && steps.verify-contents.outcome == 'success' }}
          GH_CONTENTS_TOKEN: ${{ secrets.GH_CONTENTS_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # The app path is ready when minting and the contents read both
          # succeeded. Refresh uses that token, so an expired PAT is a warning.
          # Otherwise refresh falls back to the PAT, and this check fails the job.
          if [ "${APP_READY:-}" = "true" ]; then
            STRICT=false
            echo "GitHub App installation token is the contents path. PAT expiry is a warning."
          else
            STRICT=true
            echo "Refresh falls back to GH_CONTENTS_TOKEN. PAT expiry fails this job."
          fi

          report() {
            if [ "$STRICT" = "true" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1 The refresh uses the GitHub App token. GH_CONTENTS_TOKEN is the fallback."
            exit 0
          }

          if [ -z "${GH_CONTENTS_TOKEN:-}" ]; then
            report "GH_CONTENTS_TOKEN is empty. Rotate the fine-grained PAT and update the Actions secret."
          fi

          case "${EXPIRY_MIN_DAYS:-}" in
            ''|*[!0-9]*)
              echo "::error::EXPIRY_MIN_DAYS must be a positive integer."
              exit 1
              ;;
          esac

          headers=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$headers" "$body"' EXIT

          # -sS keeps the progress meter off and still prints curl errors.
          # Verbose curl and command tracing print the Authorization header. Do not enable either.
          # Do not follow redirects. The token stays on api.github.com.
          if ! status=$(curl -sS --max-time 30 \
            -D "$headers" \
            -o "$body" \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_CONTENTS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -- "https://api.github.com/repos/${REPO}"); then
            report "The GitHub API request failed before a status code was returned."
          fi

          case "$status" in
            2[0-9][0-9]) ;;
            401|403)
              report "GitHub API returned HTTP ${status} for GH_CONTENTS_TOKEN. The token is invalid or does not have access. Rotate the fine-grained PAT and update the Actions secret."
              ;;
            [0-9][0-9][0-9])
              report "GitHub API returned HTTP ${status} while checking GH_CONTENTS_TOKEN. Expected a 2xx response."
              ;;
            *)
              report "GitHub API returned an unexpected status while checking GH_CONTENTS_TOKEN."
              ;;
          esac

          raw=$(grep -i -m 1 '^github-authentication-token-expiration:' "$headers" || true)
          expiry=$(printf '%s' "$raw" | sed 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*$//' | tr -d '\r')
          if [ -z "$expiry" ]; then
            report "The response has no github-authentication-token-expiration header. GH_CONTENTS_TOKEN should be a fine-grained PAT. Rotate the PAT and update the Actions secret."
          fi

          # GitHub sends "2026-11-09 13:05:00 -0500" or the same clock time with UTC.
          if ! printf '%s\n' "$expiry" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} ([+-][0-9]{2}:?[0-9]{2}|UTC)$'; then
            safe=$(printf '%s' "$expiry" | tr -cd '0-9A-Za-z:+-' | cut -c1-80)
            report "github-authentication-token-expiration is not a recognized date (${safe})."
          fi

          if ! expiry_epoch=$(date -u -d "$expiry" +%s); then
            report "Could not parse github-authentication-token-expiration (${expiry})."
          fi

          now_epoch=$(date -u +%s)
          remaining=$((expiry_epoch - now_epoch))
          limit=$((EXPIRY_MIN_DAYS * 86400))
          expiry_utc=$(date -u -d "$expiry" '+%Y-%m-%d %H:%M:%S UTC')

          if [ "$remaining" -lt 0 ]; then
            report "GH_CONTENTS_TOKEN expired at ${expiry_utc}. Rotate the fine-grained PAT and update the Actions secret."
          fi

          days=$((remaining / 86400))
          if [ "$remaining" -lt "$limit" ]; then
            report "GH_CONTENTS_TOKEN expires at ${expiry_utc} (${days} days remaining), under the ${EXPIRY_MIN_DAYS}-day minimum. Rotate the fine-grained PAT and update the Actions secret."
          fi

          echo "GH_CONTENTS_TOKEN expires at ${expiry_utc} (${days} days remaining)."
