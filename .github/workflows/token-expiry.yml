# Warn before the fine-grained PAT in GH_CONTENTS_TOKEN expires.
# The refresh workflow uses that token to commit public/data.
# See docs/refresh.md.
#
# Cron is UTC and does not follow US daylight time.
# The minute is 41 so this misses :00 and :30, when GitHub delays or drops
# scheduled runs under load.
#   41 12 * * 1  Monday morning Eastern.
#               12:41 UTC = 8:41 AM EDT / 7:41 AM EST.

name: Check contents token expiry

on:
  schedule:
    - cron: "41 12 * * 1"
  workflow_dispatch:

# No checkout and no GITHUB_TOKEN permissions. The request uses the PAT.
permissions: {}

jobs:
  expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Fail when the token expires sooner than this many days.
      EXPIRY_MIN_DAYS: "14"
      GH_CONTENTS_TOKEN: ${{ secrets.GH_CONTENTS_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check GH_CONTENTS_TOKEN expiry
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_CONTENTS_TOKEN:-}" ]; then
            echo "::error::GH_CONTENTS_TOKEN is empty. Rotate the fine-grained PAT and update the Actions secret."
            exit 1
          fi

          case "${EXPIRY_MIN_DAYS:-}" in
            ''|*[!0-9]*)
              echo "::error::EXPIRY_MIN_DAYS must be a positive integer."
              exit 1
              ;;
          esac

          headers=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$headers" "$body"' EXIT

          # -sS keeps the progress meter off and still prints curl errors.
          # Verbose curl and command tracing print the Authorization header. Do not enable either.
          # Do not follow redirects. The token stays on api.github.com.
          if ! status=$(curl -sS --max-time 30 \
            -D "$headers" \
            -o "$body" \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_CONTENTS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -- "https://api.github.com/repos/${REPO}"); then
            echo "::error::The GitHub API request failed before a status code was returned."
            exit 1
          fi

          case "$status" in
            2[0-9][0-9]) ;;
            401|403)
              echo "::error::GitHub API returned HTTP ${status} for GH_CONTENTS_TOKEN. The token is invalid or does not have access. Rotate the fine-grained PAT and update the Actions secret."
              exit 1
              ;;
            [0-9][0-9][0-9])
              echo "::error::GitHub API returned HTTP ${status} while checking GH_CONTENTS_TOKEN. Expected a 2xx response."
              exit 1
              ;;
            *)
              echo "::error::GitHub API returned an unexpected status while checking GH_CONTENTS_TOKEN."
              exit 1
              ;;
          esac

          raw=$(grep -i -m 1 '^github-authentication-token-expiration:' "$headers" || true)
          expiry=$(printf '%s' "$raw" | sed 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*$//' | tr -d '\r')
          if [ -z "$expiry" ]; then
            echo "::error::The response has no github-authentication-token-expiration header. GH_CONTENTS_TOKEN should be a fine-grained PAT. Rotate the PAT and update the Actions secret."
            exit 1
          fi

          # GitHub sends "2026-11-09 13:05:00 -0500" or the same clock time with UTC.
          if ! printf '%s\n' "$expiry" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} ([+-][0-9]{2}:?[0-9]{2}|UTC)$'; then
            safe=$(printf '%s' "$expiry" | tr -cd '0-9A-Za-z:+-' | cut -c1-80)
            echo "::error::github-authentication-token-expiration is not a recognized date (${safe})."
            exit 1
          fi

          if ! expiry_epoch=$(date -u -d "$expiry" +%s); then
            echo "::error::Could not parse github-authentication-token-expiration (${expiry})."
            exit 1
          fi

          now_epoch=$(date -u +%s)
          remaining=$((expiry_epoch - now_epoch))
          limit=$((EXPIRY_MIN_DAYS * 86400))
          expiry_utc=$(date -u -d "$expiry" '+%Y-%m-%d %H:%M:%S UTC')

          if [ "$remaining" -lt 0 ]; then
            echo "::error::GH_CONTENTS_TOKEN expired at ${expiry_utc}. Rotate the fine-grained PAT and update the Actions secret."
            exit 1
          fi

          days=$((remaining / 86400))
          if [ "$remaining" -lt "$limit" ]; then
            echo "::error::GH_CONTENTS_TOKEN expires at ${expiry_utc} (${days} days remaining), under the ${EXPIRY_MIN_DAYS}-day minimum. Rotate the fine-grained PAT and update the Actions secret."
            exit 1
          fi

          echo "GH_CONTENTS_TOKEN expires at ${expiry_utc} (${days} days remaining)."
